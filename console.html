<!DOCTYPE html>
<html>
    <head>
        <title>Lost Timer - Console</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
        
        <link href="css/lost-timer.css" rel="stylesheet" type="text/css">
        
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const consoleInput = document.querySelector('.my-console');
                const timerStatus = document.querySelector('.timer-status');
                const cursor = document.querySelector('.console-cursor');

                // Measure text width using canvas and move cursor after typed text
                function updateCursorPosition() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const style = window.getComputedStyle(consoleInput);
                    ctx.font = style.fontSize + ' ' + style.fontFamily;
                    const at = consoleInput.selectionStart === null ? consoleInput.value.length : consoleInput.selectionStart;
                    const textWidth = ctx.measureText(consoleInput.value.slice(0, at)).width;
                    const right = Math.max(0, consoleInput.clientWidth - cursor.offsetWidth);
                    cursor.style.left = Math.max(0, Math.min(right, textWidth - consoleInput.scrollLeft)) + 'px';
                }
                
                // Listen for messages from main window
                window.addEventListener('message', (event) => {
                    if (event.data.type === 'enableConsole') {
                        if (document.body.classList.contains('lost-muse-active')) return;
                        consoleInput.disabled = false;
                        consoleInput.readOnly = !event.data.enabled;
                        if (event.data.enabled) {
                            if (!document.hidden) consoleInput.focus();
                            updateCursorPosition();
                            timerStatus.textContent = `Оставшееся время для ввода кода: ${event.data.remainingTime} секунд`;
                        } else {
                            if (window.LostConsoleInput) window.LostConsoleInput.refresh();
                            updateCursorPosition();
                            timerStatus.textContent = event.data.remainingTime > 240 ? 
                                'Ожидание ввода кода' : 'Время ввода истекло';
                        }
                    }
                });

                document.addEventListener('visibilitychange', () => { if (!document.hidden && !consoleInput.disabled) consoleInput.focus(); });

                ['input', 'select', 'click', 'scroll'].forEach(name => consoleInput.addEventListener(name, updateCursorPosition));
                document.addEventListener('selectionchange', updateCursorPosition);
                window.addEventListener('resize', updateCursorPosition);
                window.addEventListener('lost-console-command-change', updateCursorPosition);
                // Handle input submission
                consoleInput.addEventListener('keyup', (e) => {
                    updateCursorPosition();
                    if (e.key === 'Enter' && !consoleInput.readOnly && !consoleInput.disabled) {
                        window.opener.postMessage({
                            type: 'numberSubmitted',
                            value: consoleInput.value
                        }, '*');
                        consoleInput.value = '';
                        updateCursorPosition();
                    }
                });
            });
        </script>
        <link href="ups/client.css" rel="stylesheet" type="text/css">
        <link href="muse/client.css" rel="stylesheet" type="text/css">
        <link href="css/station-ui.css" rel="stylesheet" type="text/css">
        <script defer src="js/station-input.js"></script>
        <script defer src="muse/client.js"></script>
        <script defer src="ups/telemetry.js"></script>
        <script defer src="ups/client.js"></script>
        <script defer src="vpn/client.js"></script>
        <script defer src="flame/client.js"></script>
    </head>
    <body class="console-page">
        <div class="timer-status">
            Ожидание ввода кода
        </div>
        <div class="console-container">
            <div class="console-prompt">
                >:
            </div>
            <div class="console-input">
                <input type="text" class="my-console" readonly autocomplete="off" spellcheck="false" /><span class="console-cursor"></span>
            </div>
        </div>
    </body>
</html>
